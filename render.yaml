# render.yaml — Lightweight deployment (TruthScan API only, no PyTorch)

services:
  - type: web
    name: ai-detector-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.lite
    dockerContext: ./backend
    region: oregon
    plan: free

    healthCheckPath: /health
    numInstances: 1

    envVars:
      - key: FIREBASE_PROJECT_ID
        value: capstone-project-96d2e

      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: TRUTHSCAN_API_KEY
        sync: false

      - key: LIGHTWEIGHT_MODE
        value: "true"

      - key: ALLOWED_ORIGINS
        value: https://capstone-project-96d2e.web.app,https://capstone-project-96d2e.firebaseapp.com,http://localhost:5174

      - key: MAX_IMAGE_SIZE_MB
        value: "50"

      - key: MAX_VIDEO_SIZE_MB
        value: "500"

      - key: SKIP_AUTH
        value: "false"
